name: Native desktop builds
on: [push, workflow_dispatch]
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - run: swift test --package-path macOS
      - run: bash scripts/build-macos.sh
        env:
          RECALL_ALLOW_ADHOC: "1"
      - run: ditto -c -k --sequesterRsrc --keepParent 'release/Recall.app' release/Recall-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Recall-macOS
          path: release/Recall-macOS.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project Windows/Rewind.Tests/Rewind.Tests.csproj
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build CLI for native desktop integration
        run: python scripts/build-cli.py
      - name: Windows navigation, recording recovery and CLI ownership
        shell: pwsh
        run: ./scripts/test-windows-merged-integration.ps1 -Executable "$pwd/release/recall-windows-x64/Recall.exe" -Cli "$pwd/release/Recall-CLI-win-x64/recall.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Recall-Windows-x64
          path: |
            release/Recall-Windows-x64.zip
            release/Recall-Windows-x64-Setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Recall-Windows-native-validation
          path: |
            release/windows-smoke
            release/windows-integration/**/*.json
            release/windows-integration/startup.log
